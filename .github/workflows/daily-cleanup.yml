name: Daily Dead Stream Auto Cleaner Bot
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Auto Cleanup API
        run: |
          curl -X POST https://ubcexx-50v.pages.dev/api/cron/cleanup \
            -H "Authorization: Bearer ${{ secrets.JWT_SECRET || 'ubcexx_super_cron_secret' }}"
